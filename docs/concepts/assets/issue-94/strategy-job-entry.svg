<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Mockup: Job creation entry with single job and backup strategy</title>
  <desc id="desc">A Borg Backup UI jobs page mockup showing two creation paths: a single backup job and a 3-2-1-0-0 backup strategy.</desc>
  <defs>
    <style>
      .bg{fill:#f4f7fb}.panel{fill:#fff;stroke:#d8dee8;stroke-width:1}.soft{fill:#f7fafc;stroke:#d8dee8;stroke-width:1}.header{fill:#111827;font:700 24px Arial,sans-serif}.title{fill:#111827;font:700 17px Arial,sans-serif}.sub{fill:#52637a;font:400 13px Arial,sans-serif}.label{fill:#5f6f86;font:700 11px Arial,sans-serif;letter-spacing:.05em}.text{fill:#172033;font:400 13px Arial,sans-serif}.muted{fill:#6b7a90;font:400 12px Arial,sans-serif}.blue{fill:#eaf2ff;stroke:#4d8df7}.blueSolid{fill:#2f7df6}.blueText{fill:#145fd7;font:700 13px Arial,sans-serif}.green{fill:#e8f8ee;stroke:#5ec878}.greenText{fill:#087b34;font:700 13px Arial,sans-serif}.yellow{fill:#fff6dc;stroke:#e6a700}.yellowText{fill:#9a6400;font:700 13px Arial,sans-serif}.line{stroke:#d8dee8;stroke-width:1}.white{fill:#fff;font:700 13px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1440" height="760"/>
  <rect x="24" y="24" width="1392" height="86" rx="10" class="panel"/>
  <text x="44" y="58" class="header">Jobs</text>
  <text x="44" y="84" class="sub">Backup-Jobs und Strategiegruppen verwalten</text>
  <rect x="1064" y="48" width="146" height="34" rx="7" class="soft"/>
  <text x="1088" y="70" class="blueText">Einzeljob erstellen</text>
  <rect x="1224" y="48" width="168" height="34" rx="7" class="blueSolid"/>
  <text x="1248" y="70" class="white">Backup-Strategie</text>

  <rect x="24" y="132" width="270" height="584" rx="10" class="panel"/>
  <text x="44" y="164" class="label">GRUPPIERUNG</text>
  <text x="44" y="190" class="title">Standorte</text>
  <rect x="44" y="216" width="230" height="58" rx="8" class="blue"/>
  <text x="70" y="240" class="blueText">Alle Standorte</text>
  <text x="70" y="258" class="muted">11 Jobs · 3 Strategien</text>
  <text x="44" y="320" class="label">LOKAL</text>
  <text x="44" y="354" class="title">Appdata - Lokal</text>
  <text x="44" y="386" class="title">Flash - Lokal</text>
  <text x="44" y="418" class="title">Photos - Lokal</text>
  <text x="44" y="470" class="label">STRATEGIEGRUPPEN</text>
  <text x="44" y="504" class="greenText">Appdata 3-2-1-0-0</text>
  <text x="44" y="536" class="yellowText">Photos Offsite prüfen</text>

  <rect x="314" y="132" width="1086" height="164" rx="10" class="panel"/>
  <text x="334" y="164" class="label">NEUER EINSTIEG</text>
  <text x="334" y="194" class="header">Was möchtest du erstellen?</text>
  <text x="334" y="222" class="sub">Der bestehende Einzeljob bleibt erhalten. Für 3-2-1-0-0 führt ein neuer Strategie-Wizard durch Quelle, Ziele, Zeitpläne und Restore-Tests.</text>
  <rect x="334" y="248" width="234" height="34" rx="7" class="soft"/>
  <text x="356" y="270" class="blueText">Einzelnen Backup-Job erstellen</text>
  <rect x="584" y="248" width="226" height="34" rx="7" class="blueSolid"/>
  <text x="612" y="270" class="white">Backup-Strategie erstellen</text>

  <rect x="314" y="316" width="524" height="360" rx="10" class="panel"/>
  <text x="334" y="348" class="label">EINZELNER BACKUP-JOB</text>
  <text x="334" y="378" class="title">Eine operative Sicherung</text>
  <text x="334" y="412" class="text">Geeignet für Spezialfälle, Tests oder bewusst einzelne Repositories.</text>
  <line x1="334" y1="440" x2="818" y2="440" class="line"/>
  <text x="334" y="472" class="text">Quelle oder Job-Typ</text>
  <text x="558" y="472" class="muted">Appdata</text>
  <text x="334" y="512" class="text">Ziel</text>
  <text x="558" y="512" class="muted">USB</text>
  <text x="334" y="552" class="text">Zeitplan</text>
  <text x="558" y="552" class="muted">täglich 10:00</text>
  <text x="334" y="606" class="yellowText">Wird nicht automatisch mit anderen Jobs gruppiert.</text>

  <rect x="858" y="316" width="542" height="360" rx="10" class="panel"/>
  <text x="878" y="348" class="label">BACKUP-STRATEGIE</text>
  <text x="878" y="378" class="title">Ein geschützter Datenbereich mit mehreren Zielen</text>
  <text x="878" y="412" class="text">Geeignet für 3-2-1-0-0: eine Quelle, mehrere Ziel-Jobs, gemeinsame Bewertung.</text>
  <line x1="878" y1="440" x2="1380" y2="440" class="line"/>
  <text x="878" y="472" class="text">Protected Dataset</text>
  <text x="1082" y="472" class="muted">Appdata · /mnt/user/appdata</text>
  <text x="878" y="512" class="text">Ziel 1</text>
  <text x="1082" y="512" class="muted">Lokal · /mnt/backup/appdata · 09:00</text>
  <text x="878" y="552" class="text">Ziel 2</text>
  <text x="1082" y="552" class="muted">USB · /mnt/disks/WEDJJER/appdata · 10:00</text>
  <text x="878" y="592" class="text">Ziel 3</text>
  <text x="1082" y="592" class="muted">Storagebox · ssh://.../backup/appdata · 22:00</text>
  <text x="878" y="646" class="greenText">Wird als gemeinsame Strategiegruppe bewertet.</text>
</svg>

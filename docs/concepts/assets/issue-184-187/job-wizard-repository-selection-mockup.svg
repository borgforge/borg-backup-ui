<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Job wizard repository selection mockup</title>
  <desc id="desc">Mockup for selecting an existing repository in the backup job wizard.</desc>
  <defs>
    <style>
      .back{fill:#111820}.modal{fill:#1b222b;stroke:#334155}.panel{fill:#151b22;stroke:#334155}.soft{fill:#202833;stroke:#3f4c5d}.text{font:15px Arial,sans-serif;fill:#f8fafc}.muted{font:13px Arial,sans-serif;fill:#94a3b8}.h1{font:bold 23px Arial,sans-serif;fill:#f8fafc}.h2{font:bold 16px Arial,sans-serif;fill:#f8fafc}.step{fill:#101722;stroke:#334155}.stepOn{fill:#0f2a4f;stroke:#2f80ed}.blue{fill:#2f80ed}.btnText{font:bold 14px Arial,sans-serif;fill:white}.badge{fill:#0f3b25;stroke:#2eb463}.badgeText{font:bold 12px Arial,sans-serif;fill:#70e092}.line{stroke:#334155}.field{fill:#0b1118;stroke:#334155}.small{font:12px Arial,sans-serif;fill:#94a3b8}
    </style>
  </defs>
  <rect class="back" width="1100" height="760"/>
  <rect class="modal" x="70" y="36" width="960" height="688" rx="14"/>
  <text class="h1" x="102" y="82">Neuer Backup-Job</text>
  <text class="muted" x="102" y="106">Repository auswählen statt Repository-Pfad manuell erzeugen.</text>
  <line class="line" x1="70" y1="126" x2="1030" y2="126"/>

  <g transform="translate(102,150)">
    <rect class="step" x="0" y="0" width="130" height="54" rx="8"/><text class="h2" x="18" y="24">1 Daten</text><text class="small" x="18" y="43">Quelle</text>
    <rect class="stepOn" x="140" y="0" width="170" height="54" rx="8"/><text class="h2" x="158" y="24">2 Repository</text><text class="small" x="158" y="43">Ziel wählen</text>
    <rect class="step" x="320" y="0" width="130" height="54" rx="8"/><text class="h2" x="338" y="24">3 Policy</text><text class="small" x="338" y="43">Retention</text>
    <rect class="step" x="460" y="0" width="150" height="54" rx="8"/><text class="h2" x="478" y="24">4 Runtime</text><text class="small" x="478" y="43">Docker/VM</text>
    <rect class="step" x="620" y="0" width="150" height="54" rx="8"/><text class="h2" x="638" y="24">5 Zeitplan</text><text class="small" x="638" y="43">Cron</text>
  </g>

  <rect class="panel" x="102" y="230" width="890" height="360" rx="10"/>
  <text class="h1" x="132" y="268">Repository auswählen</text>
  <text class="muted" x="132" y="292">Der Job schreibt in ein bestehendes oder gerade angelegtes Repository.</text>
  <rect class="field" x="132" y="326" width="800" height="46" rx="7"/>
  <text class="text" x="152" y="355">Appdata - USB</text>
  <text class="muted" x="300" y="355">USB-5TB · /mnt/disks/USB-5TB/borg-backup-appdata</text>
  <text class="text" x="905" y="355">⌄</text>

  <rect class="soft" x="132" y="396" width="800" height="80" rx="9"/>
  <text class="h2" x="156" y="426">Appdata - USB</text>
  <text class="muted" x="156" y="450">Storage: USB-5TB · Typ: usb · Letzter Test: OK</text>
  <rect class="badge" x="810" y="416" width="78" height="28" rx="14"/><text class="badgeText" x="831" y="435">OK</text>

  <rect class="soft" x="132" y="500" width="250" height="42" rx="7"/><text class="text" x="154" y="526">Neues Repository</text>
  <rect class="soft" x="400" y="500" width="270" height="42" rx="7"/><text class="text" x="422" y="526">Bestehendes importieren</text>
  <text class="muted" x="132" y="566">Erweiterter Modus: Repository-Pfad manuell eingeben</text>

  <line class="line" x1="70" y1="620" x2="1030" y2="620"/>
  <rect class="soft" x="760" y="650" width="105" height="38" rx="7"/><text class="text" x="786" y="674">Zurück</text>
  <rect class="blue" x="880" y="650" width="126" height="38" rx="7"/><text class="btnText" x="914" y="674">Weiter</text>
</svg>

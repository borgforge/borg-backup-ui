name: Prepare stable release PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable candidate version successfully tested on Unraid'
        required: true
        type: string
      confirm_tested:
        description: 'I confirm the selected version passed my Unraid test'
        required: true
        type: boolean
        default: false
      platform:
        type: choice
        description: 'Unraid 8 is not implemented'
        options: [unraid-legacy, unraid-8]
        default: unraid-legacy
permissions:
  contents: read
  actions: read
concurrency:
  group: prepare-stable
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && inputs.confirm_tested
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ github.sha }}
  prepare:
    needs: audit
    environment: stable
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLATFORM: ${{ inputs.platform }}
      VERSION: ${{ inputs.version }}
      CONFIRM_TESTED: ${{ inputs.confirm_tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare approved tested bytes and create release PR
        env:
          GH_TOKEN: ${{ secrets.BBUI_BOT_TOKEN }}
          BBUI_ENVIRONMENT: stable
        run: python3 plugin/ci_release.py stable
